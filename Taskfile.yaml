version: '3'

# Offline Elastic installer pipeline.
#   task download    # fetch everything for the EAR/EPR/containers
#   task build       # build the package-registry binary
#   task package     # verify + tar up dist/ for transfer
#
# Override vars on the CLI, e.g.:  task download:ear TARGET_ARCH=arm64

vars:
  STACK_VERSION: "9.5.7"          # keep in sync with README
  TARGET_ARCH: amd64              # target servers (amd64|arm64); dev laptop is arm
  EPR_VERSION: latest             # package-registry git tag
  SNMP_EXPORTER_VERSION: v0.31.0
  TRIVY_VERSION: v0.76.2              # docker tag is the gh tag without the 'v'
  CHECKOV_VERSION: 3.4.6
  KSM_VERSION: v2.20.0                # kube-state-metrics (registry.k8s.io)
  GITLAB_RUNNER_VERSION: v19.6.0      # tag: gitlab/gitlab-runner:ubuntu-<ver>
  GITLAB_RUNNER_FLAVOR: ubuntu        # ubuntu|alpine
  AUDITOR_VERSION: 7.3.4              # cincproject/auditor (Chef InSpec, open)
  VENOM_VERSION: v1.3.0               # ovhcom/venom integration-test runner
  CONTAINER_PLATFORM: linux/amd64
  CADDY_VERSION: latest             # static binary serving the EAR over HTTPS
  DIAG_VERSION: latest              # elastic/support-diagnostics release tag
  ML_MODELS: elser_model_2_linux-x86_64   # space-separated; see download_models.sh header
  DIST_DIR: dist

tasks:
  default:
    cmds: [task --list]
    silent: true

  all:
    desc: "Full pipeline: download everything, build components, verify + package bundle"
    cmds:
      - task: download
      - task: build
      - task: package

  download:
    desc: Download everything (EAR artifacts, integrations, containers, webserver, tools, feeds)
    deps: [download:ear, download:integrations, download:containers, download:webserver, download:tools, download:feeds]

  download:ear:
    desc: Stack artifacts (deb + tar.gz/zip + sha512/asc), GPG key, GeoIP mirror
    env:
      STACK_VERSION: "{{.STACK_VERSION}}"
      TARGET_ARCH: "{{.TARGET_ARCH}}"
      OUT_DIR: "{{.DIST_DIR}}/ear"
    cmds: [./scripts/download_ear.sh]

  download:integrations:
    desc: Integration zips + signatures from epr.elastic.co into dist/epr/packages
    cmds:
      - python3 scripts/download_integrations.py --out {{.DIST_DIR}}/epr/packages {{.CLI_ARGS}}

  download:webserver:
    desc: Caddy binary + Caddyfile + systemd unit into dist/web
    env:
      CADDY_VERSION: "{{.CADDY_VERSION}}"
      TARGET_ARCH: "{{.TARGET_ARCH}}"
      OUT_DIR: "{{.DIST_DIR}}/web"
    cmds: [./scripts/download_webserver.sh]

  download:tools:
    desc: support-diagnostics, Temurin JRE and elastic-package into dist/tools
    env:
      DIAG_VERSION: "{{.DIAG_VERSION}}"
      OUT_DIR: "{{.DIST_DIR}}/tools"
    cmds: [./scripts/download_tools.sh]

  download:feeds:
    desc: Third-party runtime feeds (CISA KEV, STIX/TAXII threat intel) into dist/ear/feeds
    cmds:
      - python3 scripts/download_feeds.py --config files/feeds.json --dest {{.DIST_DIR}}/ear/feeds {{.CLI_ARGS}}

  download:models:
    desc: "ML trained models into dist/ear/models (big; opt-in). ML_MODELS='elser_model_2_linux-x86_64 rerank-v1' task download:models"
    env:
      ML_MODELS: "{{.ML_MODELS}}"
      OUT_DIR: "{{.DIST_DIR}}/ear/models"
    cmds: [./scripts/download_models.sh]

  download:containers:
    desc: Export image tars via skopeo container ({{.CONTAINER_PLATFORM}})
    env:
      STACK_VERSION: "{{.STACK_VERSION}}"
      SNMP_EXPORTER_VERSION: "{{.SNMP_EXPORTER_VERSION}}"
      TRIVY_VERSION: "{{.TRIVY_VERSION}}"
      CHECKOV_VERSION: "{{.CHECKOV_VERSION}}"
      KSM_VERSION: "{{.KSM_VERSION}}"
      GITLAB_RUNNER_VERSION: "{{.GITLAB_RUNNER_VERSION}}"
      GITLAB_RUNNER_FLAVOR: "{{.GITLAB_RUNNER_FLAVOR}}"
      AUDITOR_VERSION: "{{.AUDITOR_VERSION}}"
      VENOM_VERSION: "{{.VENOM_VERSION}}"
      CONTAINER_PLATFORM: "{{.CONTAINER_PLATFORM}}"
      OUT_DIR: "{{.DIST_DIR}}/containers"
    cmds: [./scripts/save_containers.sh]

  build:
    desc: Build all components
    deps: [build:epr, build:epr-image]

  build:epr-image:
    desc: "EPR distribution image (registry+packages) via buildah container"
    deps: [download:integrations]
    env:
      STACK_VERSION: "{{.STACK_VERSION}}"
      CONTAINER_PLATFORM: "{{.CONTAINER_PLATFORM}}"
      EPR_VERSION: "{{.EPR_VERSION}}"
      OUT_DIR: "{{.DIST_DIR}}/containers"
      PACKAGES_DIR: "{{.DIST_DIR}}/epr/packages"
    cmds: [./scripts/build_epr_image.sh]

  build:integration:
    desc: "Build a custom integration zip. Usage: task build:integration -- <git-url> [subdir] [ref]"
    cmds:
      - ./scripts/build_integration.sh {{.CLI_ARGS}}

  build:epr:
    desc: Compile package-registry and assemble dist/epr (binary, config, unit)
    env:
      EPR_VERSION: "{{.EPR_VERSION}}"
      OUT_DIR: "{{.DIST_DIR}}/epr"
    cmds: [./scripts/build_epr.sh]

  check:versions:
    desc: Warn if pinned component versions are behind upstream releases
    cmds:
      - python3 scripts/check_versions.py

  verify:
    desc: Verify sha512 checksums of everything in dist/ear
    cmds:
      - cd {{.DIST_DIR}}/ear && find . -name '*.sha512' -execdir sha512sum -c {} +

  manifest:
    desc: Record every artifact in dist/ into dist/manifest.json
    cmds:
      - python3 scripts/build_manifest.py --dist {{.DIST_DIR}} --stack-version {{.STACK_VERSION}} scan

  manifest:diff:
    desc: Show artifacts new/changed/missing vs the recorded manifest
    cmds:
      - python3 scripts/build_manifest.py --dist {{.DIST_DIR}} diff

  manifest:verify:
    desc: Re-hash dist/ and report drift vs the recorded manifest
    cmds:
      - python3 scripts/build_manifest.py --dist {{.DIST_DIR}} verify

  package:
    desc: Verify, then tar dist/ into a dated, numbered bundle (records manifest.json)
    deps: [verify]
    vars:
      BUNDLE: {sh: "python3 scripts/build_manifest.py --dist {{.DIST_DIR}} --stack-version {{.STACK_VERSION}} prepare-bundle"}
    cmds:
      # no compression: dist/ is ~all pre-compressed content; gzip measured
      # bigger than the input and minutes slower. `tar -I pigz` re-enables .gz
      - tar -cf "{{.BUNDLE}}" -C {{.DIST_DIR}} .
      - echo "wrote {{.BUNDLE}}"

  package:delta:
    desc: Tar only artifacts new/changed since the last packaged manifest
    deps: [verify]
    cmds:
      - python3 scripts/build_manifest.py --dist {{.DIST_DIR}} --stack-version {{.STACK_VERSION}} delta

  clean:
    desc: Remove dist/ and bundle tarballs (keeps manifest.json as the delta baseline)
    cmds:
      - |
        if [ -d "{{.DIST_DIR}}" ]; then
          find "{{.DIST_DIR}}" -mindepth 1 -maxdepth 1 ! -name manifest.json -exec rm -rf {} +
        fi
      - rm -f elastic-offline-bundle-*.tar* elastic-offline-delta-*.tar*
